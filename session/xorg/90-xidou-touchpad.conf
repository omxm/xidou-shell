# Xidou Shell — touchpad scroll direction.
#
# libinput's natural-scrolling default isn't consistent across machines (this
# repo has already seen it differ: off by default on the X1 Carbon, and the
# X230's own machine default apparently read as "natural" by comparison,
# purely by accident since nothing here ever set it explicitly). Pin it
# instead of inheriting whatever a given kernel/libinput build defaults to,
# so Xidou feels the same on any machine it runs on.
#
# Matches any touchpad generically (MatchIsTouchpad), not a specific device
# name, since that varies per machine (this one: "Synaptics TM3289-002";
# the X230 was something else entirely) — do not hardcode a device name here.
#
# Named 90- (not 40-, matching this repo's udev rule convention) so it's
# read after /usr/share/X11/xorg.conf.d/40-libinput.conf's own generic
# touchpad catchall and reliably wins for this option.
#
# One-time setup (not run automatically by anything in this repo):
#   sudo cp session/xorg/90-xidou-touchpad.conf /etc/X11/xorg.conf.d/
#   (then log out/in, or restart the X server, for it to take effect)
Section "InputClass"
    Identifier "Xidou touchpad natural scrolling"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection
