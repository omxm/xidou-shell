# Example Xidou Shell config.
#
# Copy this file to ~/.config/xidou/config.toml and edit it there. Every key
# has a built-in default (see quickshell/config/Config.qml), so you only need
# to keep the keys you actually want to change from the shipped defaults.

[shell]
name = "Xidou"
version = "0.1.0"

[theme]
mode = "dark"              # dark | light | auto
source = "builtin"         # builtin | wallpaper (wallpaper uses matugen's generated palette, see services/ColorScheme.qml)
accent = "#c9b890"
background = "#1a1a1a"
surface = "#242424"
surface_alt = "#2e2e2e"
text = "#eaeaea"
text_muted = "#9a9a9a"
border = "#3a3a3a"
radius = 10
font_family = "Inter"
icon_font_family = "Material Symbols Outlined"
font_size = 14
scheme_type = "scheme-tonal-spot"  # active matugen --type when source = "wallpaper"; must be one of theme.scheme_presets' values below

# Friendly names for the wallpaper-picker's scheme-preset dropdown. matugen's
# own --type values (right-hand side, confirmed against its --help) have no
# "Soft"/"Vibrant" naming of their own -- rename or reorder these freely, no
# code change needed.
[theme.scheme_presets]
Soft = "scheme-tonal-spot"
Vibrant = "scheme-vibrant"
Expressive = "scheme-expressive"
Muted = "scheme-neutral"
Monochrome = "scheme-monochrome"
Playful = "scheme-fruit-salad"
Rainbow = "scheme-rainbow"
Faithful = "scheme-fidelity"
Natural = "scheme-content"
Smart = "scheme-smart"

[bar]
position = "top"           # top | bottom
height = 32
modules_left = ["logo", "workspaces"]
modules_center = ["media", "clock", "weather"]
modules_right = ["tray", "mem", "cpu", "bluetooth", "volume", "dnd", "power"]

[weather]
enabled = true
# Resolution priority: auto_locate (IP geolocation) > city (geocoded via
# Open-Meteo) > latitude/longitude used as-is.
auto_locate = true
city = ""
latitude = 0.0
longitude = 0.0
units = "celsius"          # celsius | fahrenheit

[osd]
width = 220
height = 56
position = "top-center"    # top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
margin = 8                 # gap from the bar/screen edge the position anchors to

[notification]
position = "top-right"     # same values as [osd].position
margin = 12
width = 320
spacing = 8                # gap between stacked notification cards
timeout_ms = 5000          # default auto-dismiss; overridden per-notification when the sender sets its own expire timeout

[motion]
enabled = true
duration = 0.15            # seconds; drives both open/show and close/hide legs
preset = "normal"          # subtle | normal | pronounced -- intensity of picom's appear/disappear scale+fade, not an easing curve (picom's preset has no curve param)

[screenshot]
freeze_during_selection = true  # freeze the desktop behind a static backdrop during region-select, rather than re-capturing live
confirm_selection = true        # show the Save/Cancel preview dialog after a capture, rather than saving instantly
remember_last_region = false    # off by default: with no second keybind for "reselect", turning this on leaves no way back to a fresh selection short of restarting the shell
include_cursor = false          # include the mouse pointer in the captured image
save_directory = "~/Pictures/Screenshots"

[panels.control_center]
enabled = true
keybind = "super+e"

[panels.launcher]
enabled = true
keybind = "super+d"

[panels.wallpaper]
enabled = true
keybind = "super+y"
directories = ["~/Pictures/Wallpapers"]

[panels.clipboard]
enabled = true
keybind = "super+v"

[panels.notification]
enabled = true
dnd_keybind = "super+n"

[panels.session]
enabled = true
keybind = "super+escape"
lock_keybind = "super+l"

[panels.settings]
enabled = true
keybind = "super+comma"

[startup]
enabled = true
logo = "~/.config/xidou/assets/logo.svg"
