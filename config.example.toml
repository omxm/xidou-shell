# Example Xidou Shell config.
#
# Copy this file to ~/.config/xidou/config.toml and edit it there. Every key
# has a built-in default (see quickshell/config/Config.qml), so you only need
# to keep the keys you actually want to change from the shipped defaults.

[shell]
name = "Xidou"
version = "0.1.0"

[theme]
mode = "dark"              # dark | light | auto
source = "builtin"         # builtin | wallpaper (wallpaper uses matugen's generated palette, see services/ColorScheme.qml)
accent = "#c9b890"
background = "#1a1a1a"
surface = "#242424"
surface_alt = "#2e2e2e"
text = "#eaeaea"
text_muted = "#9a9a9a"
border = "#3a3a3a"
warning = "#e06c75"        # Mem/CPU bar widgets recolor to this at/above their configured usage threshold
radius = 10
font_family = "Inter"
icon_font_family = "Material Symbols Outlined"
font_size = 14
scheme_type = "scheme-tonal-spot"  # active matugen --type when source = "wallpaper"; must be one of theme.scheme_presets' values below

# Friendly names for the wallpaper-picker's scheme-preset dropdown. matugen's
# own --type values (right-hand side, confirmed against its --help) have no
# "Soft"/"Vibrant" naming of their own -- rename or reorder these freely, no
# code change needed.
[theme.scheme_presets]
Soft = "scheme-tonal-spot"
Vibrant = "scheme-vibrant"
Expressive = "scheme-expressive"
Muted = "scheme-neutral"
Monochrome = "scheme-monochrome"
Playful = "scheme-fruit-salad"
Rainbow = "scheme-rainbow"
Faithful = "scheme-fidelity"
Natural = "scheme-content"
Smart = "scheme-smart"

[bar]
enabled = true
position = "top"           # top | bottom
height = 32
auto_hide = "off"          # off | on | smart (smart: only hides while the viewed tag has a client on it)
reserve_space = true       # ignored (treated as false) whenever auto_hide != "off"

# Bar > Layout. Ends Margin + Edge Margin together make a "floating bar" --
# shortened from both horizontal ends AND lifted off the anchored screen
# edge at the same time.
[bar.layout]
content_scale = 1.0         # 0.5-1.5, uniform per-widget visual zoom
font_scale = 1.0             # 0.5-1.5, text/icon size only (independent of content_scale)
ends_margin = 0              # px, shortens the bar from both horizontal ends
edge_margin = 0              # px, gap between the bar and the screen edge it's anchored to
opposite_edge_margin = 0     # px, extra reserved strut space beyond the bar's own thickness
content_padding = 8          # px, inner horizontal inset around all module content
panel_overlap = 0            # px (Advanced) -- lets windows tile this many px under the bar's edge

modules_left = ["logo", "workspaces"]
modules_center = ["media", "clock", "weather"]
modules_right = ["tray", "mem", "cpu", "bluetooth", "volume", "dnd", "power"]

# Bar-wide capsule styling -- wraps every module's background in a pill
# shape when enabled. Bar-wide only; a per-widget override layer is
# deferred future work.
[bar.capsules]
enabled = false
thickness = 0.8       # fraction of bar.height
radius = 20            # clamped to half of the capsule's own (width, height) at render time -- 20 yields a full pill at realistic bar heights
fill = "surface_alt"   # surface | surface_alt | accent | background
padding = 10            # horizontal inset each side, px
border_width = 0        # 0 = no border; color is always theme.border
opacity = 1.0

# Bar > Dead Zone: clicks and scrolling on empty bar space, each an action id
# from `xidou msg actions list`; "" = nothing. A widget's click or scroll with
# no action of its own lands here too.
[bar.dead_zone]
left_click = ""
right_click = "control_center.toggle"
middle_click = ""
scroll_up = ""
scroll_down = ""

# Bar > Shape. Before this existed, the bar had zero rounding capability at
# all -- *_radius default to -1 ("inherit corner_radius"), not a real pixel
# value, since 0 is a real, different, selectable state (explicitly square).
[bar.shape]
corner_radius = 12
top_left_radius = -1
top_right_radius = -1
bottom_left_radius = -1
bottom_right_radius = -1
corner_flow = false     # flares the anchored edge's corners out to the true screen corner -- only visible when layout.edge_margin AND layout.ends_margin are both 0
border_enabled = false
border_width = 1

# Bar > Effects. Shadow/Contact Shadow are the shell's first use of a real
# shadow effect anywhere (QtQuick.Effects MultiEffect). Contact Shadow is
# purely aesthetic -- no "a panel is docked against the bar" concept exists,
# so it's a fixed gradient at the bar's own edge regardless of what's below.
[bar.effects]
background_opacity = 1.0
shadow_enabled = false
contact_shadow_enabled = false

# Bar > Widgets: the bar-wide DEFAULT layer a future per-widget Presentation
# override layer is meant to sit on top of. color/icon_color only replace
# the "normal/active-state" text color each module already has -- textMuted/
# warning/accent state colors (and Logo's own brand accent) are untouched.
[bar.widgets]
font_family = ""        # "" = inherit theme.font_family
font_weight = "normal"   # normal | medium | bold -- label text only, never icon glyphs
spacing = 7               # px, between modules within a lane
color = ""                # "" = inherit Theme.text
icon_color = ""           # "" = inherit Theme.text
hover_highlight = false

# Per-bar-widget display settings -- distinct from a widget's own top-level
# table (e.g. [weather]'s location/units, shared with the Home tab and
# control-center), since these only affect how the bar's copy renders.
#
# left_click / right_click / middle_click take an action id from the action
# registry (`xidou msg actions list`); "" = nothing, and a right click then
# falls through to the bar's dead zone (control-center at Home). Workspaces
# and Tray have per-item clicks instead.
[bar_widgets.weather]
max_length = 0          # 0 = unlimited; truncates the combined label to this many characters
show_condition = false  # append the WMO condition word (e.g. "Cloudy") after the temperature
show_temperature = true # false hides the temperature -- only meaningful combined with show_condition true
left_click = "control_center.weather"
right_click = ""
middle_click = ""

[bar_widgets.clock]
time_format = "24h" # 24h | 12h
timezone = ""        # IANA zone name (e.g. "America/New_York"); "" = system's local timezone
left_click = "control_center.calendar"
right_click = ""
middle_click = ""

[bar_widgets.workspaces]
hide_when_empty = false
style = "regular"  # regular | minimal | focus_hint
show_icons = false # only visible in practice under focus_hint

[bar_widgets.media]
album_art_only = false # show only a small art thumbnail (or fallback icon) instead of the title/artist text
hide_artist = false    # title only -- overrides artist_first below
artist_first = false   # "Artist — Title" instead of the default "Title — Artist"
left_click = "control_center.media"
right_click = "media.play_pause"
middle_click = ""

[bar_widgets.volume]
show_percentage = true # false hides the numeric label, icon only
left_click = "control_center.audio"
right_click = "audio.mute_toggle"
middle_click = ""

[bar_widgets.bluetooth]
show_device_count = true # false hides the connected-device count, icon only
left_click = "control_center.bluetooth"
right_click = ""
middle_click = ""

[bar_widgets.tray]
icon_size = 0 # 0 = default (bar height derived); otherwise an explicit pixel size
drawer = []          # tray item ids shown only while the drawer (chevron) is open
hidden = []          # tray item ids never shown
drawer_open = false  # whether the drawer starts open

[bar_widgets.mem]
warning_threshold = 90 # used% at/above this recolors the widget to theme.warning; 100 = never
left_click = "control_center.system"
right_click = ""
middle_click = ""

[bar_widgets.cpu]
warning_threshold = 90 # usage% at/above this recolors the widget to theme.warning; 100 = never
left_click = "control_center.system"
right_click = ""
middle_click = ""

[bar_widgets.logo]
left_click = ""
right_click = ""
middle_click = ""

[bar_widgets.dnd]
left_click = "control_center.notifications"
right_click = "dnd.toggle"
middle_click = ""

[bar_widgets.power]
show_percentage = true      # false hides the numeric label, icon only
low_battery_threshold = 20  # percent at/below which the low-battery icon shows instead of full
left_click = "control_center.power"
right_click = ""
middle_click = ""

# Action buttons (ROADMAP L8), off the bar by default (add them in Settings >
# Bar > Modules): one icon each, show_label adds its name. Their default
# left_click runs the action they're named after.
[bar_widgets.launcher]
show_label = false
left_click = "launcher.toggle"
right_click = ""
middle_click = ""

[bar_widgets.settings]
show_label = false
left_click = "settings.toggle"
right_click = ""
middle_click = ""

[bar_widgets.session]
show_label = false
left_click = "session.toggle"
right_click = ""
middle_click = ""

[bar_widgets.screenshot]
show_label = false
left_click = "screenshot.fullscreen"
right_click = ""
middle_click = ""

[bar_widgets.wallpaper]
show_label = false
left_click = "wallpaper.open"
right_click = ""
middle_click = ""

[bar_widgets.control_center]
show_label = false
left_click = "control_center.toggle"
right_click = ""
middle_click = ""

[bar_widgets.caffeine]
show_label = false
left_click = "caffeine.toggle"
right_click = ""
middle_click = ""

[bar_widgets.night_light]
show_label = false
left_click = "night_light.toggle"
right_click = ""
middle_click = ""

[bar_widgets.theme_mode]
show_label = false
left_click = "theme.cycle_mode"
right_click = ""
middle_click = ""

[bar_widgets.notifications]
show_label = false
left_click = "control_center.notifications"
right_click = ""
middle_click = ""

[bar_widgets.spacer]
width = 16 # px

[bar_widgets.text]
text = "" # "" hides the widget
left_click = ""
right_click = ""
middle_click = ""

[layout]
# Window gaps for the tiling layout -- a real dwm feature (xidouwm/fibonacci.c),
# not a Quickshell-side cosmetic effect. Applied once at session start
# (session/xidou-xinitrc pushes these into dwm via its setgappih/setgappoh
# IPC commands once dwm's socket is up); no settings-panel UI yet.
gap_inner = 5               # px between adjacent windows
gap_outer = 5               # px between a window and the screen edge

[weather]
enabled = true
# Resolution priority: auto_locate (IP geolocation) > city (geocoded via
# Open-Meteo) > latitude/longitude used as-is.
auto_locate = true
city = ""
latitude = 0.0
longitude = 0.0
units = "celsius"          # celsius | fahrenheit

[osd]
width = 220
height = 56
position = "top-center"    # top-left | top-center | top-right | bottom-left | bottom-center | bottom-right
margin = 8                 # gap from the bar/screen edge the position anchors to

[notification]
position = "top-right"     # same values as [osd].position
margin = 12
width = 320
spacing = 8                # gap between stacked notification cards
timeout_ms = 5000          # default auto-dismiss; overridden per-notification when the sender sets its own expire timeout

[motion]
enabled = true
duration = 0.15            # seconds; drives both open/show and close/hide legs
preset = "normal"          # subtle | normal | pronounced -- intensity of picom's appear/disappear scale+fade, not an easing curve (picom's preset has no curve param)

[screenshot]
freeze_during_selection = true  # freeze the desktop behind a static backdrop during region-select, rather than re-capturing live
confirm_selection = true        # show the Save/Cancel preview dialog after a capture, rather than saving instantly
remember_last_region = false    # off by default: with no second keybind for "reselect", turning this on leaves no way back to a fresh selection short of restarting the shell
include_cursor = false          # include the mouse pointer in the captured image
save_directory = "~/Pictures/Screenshots"
# What happens to a finished capture. At least one stays on: Settings won't
# turn off the last one, and with both false the file is saved anyway.
save_to_file = true
copy_to_clipboard = true

# Sound effects (Settings > System > Sound). Volume = each sound's own
# default x the category volume x the master volume (0.0-1.0). Do Not
# Disturb silences incoming notification sounds only. `extra` turns on
# operations that are off by default, by their id from
# quickshell/lib/SoundMap.js (e.g. "launcher_move", "window_focus"); the
# Sound page's "What plays here" lists them.
[sound]
enabled = true
volume = 1.0
pack = "zen"   # assets/sounds/<pack>/; not in the UI yet

[sound.panels]
enabled = true
volume = 1.0
extra = []

[sound.controls]
enabled = true
volume = 1.0
extra = []

[sound.windows]
enabled = true
volume = 1.0
extra = []

[sound.media]
enabled = true
volume = 1.0
extra = []

[sound.notifications]
enabled = true
volume = 1.0
extra = []

[sound.capture]
enabled = true
volume = 1.0
extra = []

[sound.devices]
enabled = true
volume = 1.0
extra = []

[sound.session]
enabled = true
volume = 1.0
extra = []

[sound.system]
enabled = true
volume = 1.0
extra = []

# Settings > System > Input. Applied with xinput to every device that has
# libinput's "Disable While Typing Enabled" property, at shell start and on
# change.
[input.touchpad]
disable_while_typing = false

# The keybind / dnd_keybind / lock_keybind keys in the [panels.*] tables
# below are documentation only for now. Nothing reads them: every key
# binding lives in xidouwm's config.h (xidouwm/config.def.h in the repo).
# Changing a value here does not rebind anything. They will become real
# with ROADMAP H4.
[panels.control_center]
enabled = true
keybind = "super+e"

[panels.launcher]
enabled = true
keybind = "super+d"

[panels.wallpaper]
enabled = true
keybind = "super+y"
directories = ["~/Pictures/Wallpapers"]

[panels.clipboard]
enabled = true
keybind = "super+v"

[panels.notification]
enabled = true
dnd_keybind = "super+n"

[panels.session]
enabled = true
keybind = "super+escape"
lock_keybind = "super+l"

[panels.settings]
enabled = true
keybind = "super+comma"

[startup]
enabled = true
logo = "~/.config/xidou/assets/logo.svg"
