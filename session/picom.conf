# Xidou Shell — picom compositor config.
#
# Exists for one reason right now: on X11, a window's alpha channel is only
# actually composited onto the screen by a running compositing manager --
# without one, Quickshell's `color: "transparent"` PanelWindows (Osd.qml,
# NotificationCard.qml, Launcher.qml) fall back to opaque, and their QML-drawn
# rounded corners render as solid black wherever another window sits behind
# them. picom is that compositor. See CLAUDE.md's philosophy section: this
# stays deliberately minimal (alpha support + basic corner rounding only) --
# shadows, fade/open-close animations, and blur are a later, separate
# visual-polish pass, not bundled in here.

backend = "xrender"; # glx needs GLX/DRI setup this 2012 Intel iGPU doesn't
                      # need for anything else in this shell; xrender is the
                      # lighter, safer default for just "make alpha work".
vsync = true;

corner-radius = 10; # independently set from config.toml's [theme].radius --
                     # both default to 10 today, but there's no shared source
                     # between them yet. Revisit if/when they drift.
round-borders = 1;
rounded-corners-exclude = [
    "window_type = 'dock'",   # dwm/Quickshell's own bar strut stays flush
    "override_redirect = 1",  # Quickshell's panels draw their own precise
                               # rounded corners in QML already; letting
                               # picom's own (coarser) corner clip apply on
                               # top of that risks a visible double-round
                               # seam rather than fixing anything.
];

# No shadow {}, fading, or blur-method here on purpose -- see the comment
# above.
