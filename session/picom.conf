# Xidou Shell — picom compositor config.
#
# Exists for one reason right now: on X11, a window's alpha channel is only
# actually composited onto the screen by a running compositing manager --
# without one, Quickshell's `color: "transparent"` PanelWindows (Osd.qml,
# NotificationCard.qml, Launcher.qml) fall back to opaque, and their QML-drawn
# rounded corners render as solid black wherever another window sits behind
# them. picom is that compositor. See CLAUDE.md's philosophy section: this
# stays deliberately minimal (alpha support + basic corner rounding only) --
# shadows, fade/open-close animations, and blur are a later, separate
# visual-polish pass, not bundled in here.

backend = "xrender"; # glx needs GLX/DRI setup this 2012 Intel iGPU doesn't
                      # need for anything else in this shell; xrender is the
                      # lighter, safer default for just "make alpha work".
vsync = true;

corner-radius = 10; # independently set from config.toml's [theme].radius --
                     # both default to 10 today, but there's no shared source
                     # between them yet. Revisit if/when they drift.
round-borders = 1;

# Per-window conditions. Once `rules` is set, picom silently ignores every
# old-style condition list (rounded-corners-exclude, shadow-exclude,
# opacity-rule, wintypes, ...), only logging a warning -- so every per-window
# condition lives here. Never add an old-style list to this file.
# Global values (corner-radius above, the animations block below) still act as
# every window's defaults; rules only override them.
#
# A condition on a property dwm or Quickshell sets needs c2's `@` suffix
# (`_XIDOU_MOTION@`, not `_XIDOU_MOTION`). dwm doesn't reparent, and without
# `@` picom reads the property once, when it first sees the window, and never
# again. See docs/ROADMAP.md H3, "Root cause found".
rules = (
    # Corner exceptions (formerly rounded-corners-exclude).
    # dwm/Quickshell's own bar strut stays flush.
    { match = "window_type = 'dock'"; corner-radius = 0; },
    # Quickshell's panels draw their own precise rounded corners in QML
    # already; letting picom's own (coarser) corner clip apply on top of
    # that risks a visible double-round seam rather than fixing anything.
    { match = "override_redirect = 1"; corner-radius = 0; },
    # Old-style mode skipped rounding fullscreen windows implicitly; rules
    # mode doesn't (picom manpage, "Migrating old rules").
    { match = "fullscreen"; corner-radius = 0; },

    # Directional tag-switch slide (docs/ROADMAP.md H3 step 2).
    # dwm's showhide() hides a client by moving it to x = -2 * its width and
    # shows it by moving it back. Right before each such move, dwm writes
    # _XIDOU_MOTION (type ATOM) on the client. The values are the contract
    # with dwm:
    #   tag-in-from-right   shown by a switch to a higher tag number
    #   tag-in-from-left    shown by a switch to a lower tag number
    #   tag-out-to-left     hidden by a switch to a higher tag number
    #   tag-out-to-right    hidden by a switch to a lower tag number
    #   anything else       not a tag switch: no slide
    # dwm must rewrite the property before *every* move it makes, relayouts
    # included; otherwise a stale tag-in-* value replays the slide on the
    # next unrelated move.
    #
    # Both sides slide by one monitor width, with the same curve and duration,
    # so the old tag and the new one move together as one surface. picom
    # decides visibility from the animated position (layer_from_window() in
    # renderer/layout.c), so an outgoing window dwm already parked off-screen
    # is still drawn while it slides out.
    #
    # Incoming windows start one monitor width to the side of where dwm put
    # them and are cropped to their monitor. Outgoing windows start where
    # they were and end one width further out. By the time the animation
    # starts, an outgoing window is already off-screen, so picom falls back to
    # the whole screen for window-monitor-* and no crop is possible. This is
    # exact on one monitor. With several monitors, the outgoing slide would be
    # too long and cross neighbouring monitors (ROADMAP H5).
    #
    # PROVISIONAL: the ease-out curve below has not been seen on real
    # hardware. Step 1 approved 0.25 s with a linear curve; compare ease-out
    # against `curve = "linear"` during the X1CG5 verification before
    # settling it (ROADMAP H3).
    { match = "_XIDOU_MOTION@ = 'tag-out-to-left'";
      animations = ({
          triggers = [ "position" ];
          offset-x = {
              curve = "cubic-bezier(0.25, 1, 0.5, 1)";
              duration = 0.25;
              start = "window-x-before - window-x";
              end = "window-x-before - window-x - window-monitor-width";
          };
          shadow-offset-x = "offset-x";
      }); },
    { match = "_XIDOU_MOTION@ = 'tag-out-to-right'";
      animations = ({
          triggers = [ "position" ];
          offset-x = {
              curve = "cubic-bezier(0.25, 1, 0.5, 1)";
              duration = 0.25;
              start = "window-x-before - window-x";
              end = "window-x-before - window-x + window-monitor-width";
          };
          shadow-offset-x = "offset-x";
      }); },
    { match = "_XIDOU_MOTION@ = 'tag-in-from-right'";
      animations = ({
          triggers = [ "position" ];
          offset-x = {
              curve = "cubic-bezier(0.25, 1, 0.5, 1)";
              duration = 0.25;
              start = "window-monitor-width";
              end = 0;
          };
          shadow-offset-x = "offset-x";
          crop-x = "window-monitor-x";
          crop-y = "window-monitor-y";
          crop-width = "window-monitor-width";
          crop-height = "window-monitor-height";
      }); },
    { match = "_XIDOU_MOTION@ = 'tag-in-from-left'";
      animations = ({
          triggers = [ "position" ];
          offset-x = {
              curve = "cubic-bezier(0.25, 1, 0.5, 1)";
              duration = 0.25;
              start = "0 - window-monitor-width";
              end = 0;
          };
          shadow-offset-x = "offset-x";
          crop-x = "window-monitor-x";
          crop-y = "window-monitor-y";
          crop-width = "window-monitor-width";
          crop-height = "window-monitor-height";
      }); }
);

# Window-open/close animations: subtle scale+fade (picom's "appear"/
# "disappear" preset), not slide -- a whole-window slide reads oddly in a
# tiling layout where windows already snap to fixed grid slots. Tag switches
# are not handled here: dwm hides clients by moving them off-screen rather
# than unmapping them, so only a "position" trigger sees a tag switch, and the
# directional one lives in `rules` above.
#
# picom's manpage says "show"/"hide" fire only for a minimized/iconified
# window, which dwm never does. They are kept here anyway (harmless) in case
# anything ever does iconify.
#
# This block is regenerated by quickshell/services/MotionSync.qml from
# config.toml's [motion] table (Settings > Appearance > Motion) whenever
# those values change -- hand-edits between the markers below will be
# silently overwritten on the next change. Everything outside the markers
# (backend, corner-radius, round-borders, etc. above) is never touched by
# that bridge.
# >>> XIDOU MANAGED: motion (Settings > Appearance > Motion) -- hand-edits here are overwritten on the next change >>>
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.92;
        duration = 0.15;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.92;
        duration = 0.15;
    }
);
# <<< XIDOU MANAGED: motion <<<

# No shadow {}, fading (the old kind -- see ANIMATIONS above for the new
# kind), or blur-method here on purpose -- see the comment above.
